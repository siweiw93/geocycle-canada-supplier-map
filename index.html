<head>

  <title>ZeroCycle Canada Supplier Map</title>

  <style>
    :root { --ink:#14243a; --muted:#607086; --green:#09254b; --green2:#174f86; --gold:#62b5e5; --paper:#f5f7fa; --line:#d7e0ea; --white:#fff; --warn:#b45c23; --blue:#175c9b; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { font:16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); overflow:hidden; }
    button, input, select { font:inherit; }
    button, a { -webkit-tap-highlight-color:transparent; }
    .app { height:100%; display:grid; grid-template-columns:minmax(300px, 380px) 1fr; grid-template-rows:auto 1fr; }
    header { grid-column:1/-1; height:72px; display:flex; align-items:center; gap:18px; padding:0 20px; background:var(--green); color:white; border-bottom:1px solid rgba(255,255,255,.15); z-index:1001; }
    .brand { display:flex; align-items:center; gap:11px; min-width:260px; }
    .brand-mark { width:36px; height:36px; display:grid; place-items:center; background:var(--gold); color:var(--green); border-radius:7px; font-weight:900; }
    h1 { margin:0; font-size:19px; line-height:1.15; letter-spacing:0; }
    .subtitle { color:#c9d9eb; font-size:13px; margin-top:2px; }
    .summary { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .metric { padding:7px 10px; border-left:1px solid rgba(255,255,255,.28); min-width:86px; }
    .metric strong { display:block; font-size:17px; line-height:1; }
    .metric span { color:#c9d9eb; font-size:12px; }
    .sidebar { min-height:0; display:flex; flex-direction:column; background:var(--white); border-right:1px solid var(--line); z-index:700; }
    .controls { padding:14px; border-bottom:1px solid var(--line); display:grid; gap:10px; }
    .search-wrap { position:relative; }
    .search-wrap svg { position:absolute; left:11px; top:12px; color:var(--muted); }
    #search { width:100%; height:42px; padding:0 12px 0 38px; border:1px solid #bfcac4; border-radius:6px; background:#fff; color:var(--ink); }
    #search:focus, select:focus, button:focus-visible { outline:3px solid rgba(240,183,67,.4); outline-offset:1px; }
    .filter-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    select { width:100%; height:38px; border:1px solid #c8d1cc; border-radius:6px; background:white; padding:0 8px; color:var(--ink); }
    .result-head { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:13px; }
    .text-button { border:0; background:none; color:var(--green2); font-weight:700; padding:4px; cursor:pointer; }
    .company-list { list-style:none; padding:8px; margin:0; overflow:auto; min-height:0; }
    .company-item { width:100%; text-align:left; background:white; border:1px solid transparent; border-bottom-color:#e3e8e4; padding:11px 10px; cursor:pointer; display:grid; grid-template-columns:34px 1fr; gap:10px; }
    .company-item:hover, .company-item.active { background:#eef5f1; border-color:#bfd2c7; border-radius:6px; }
    .monogram { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:#dceae4; color:var(--green); font-size:12px; font-weight:800; overflow:hidden; }
    .monogram img { width:100%; height:100%; object-fit:contain; background:white; padding:3px; }
    .company-name { display:block; font-weight:750; font-size:14px; line-height:1.25; }
    .company-meta { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; margin-top:5px; }
    .dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
    .dot.verified-address { background:#3d8b63; }
    .dot.name-match-review { background:#3d8b63; }
    .dot.unmapped-review { background:#a6afaa; }
    .map-wrap { position:relative; min-width:0; }
    #map { width:100%; height:100%; background:#e4ebf2; }
    .legend { position:absolute; left:14px; bottom:20px; z-index:500; background:rgba(255,255,255,.96); border:1px solid var(--line); padding:10px 12px; border-radius:6px; box-shadow:0 4px 16px rgba(23,33,31,.13); font-size:12px; }
    .legend-title { font-weight:800; margin-bottom:5px; }
    .legend-row { display:flex; align-items:center; gap:7px; margin-top:4px; }
    .detail { position:absolute; right:14px; top:66px; z-index:600; width:min(380px, calc(100% - 28px)); max-height:calc(100% - 86px); overflow:auto; background:white; border:1px solid var(--line); border-radius:8px; box-shadow:0 12px 32px rgba(23,33,31,.2); padding:18px; display:none; }
    .detail.open { display:block; }
    .detail-close { position:sticky; top:0; z-index:2; float:right; width:38px; height:38px; margin:-8px -8px 4px 8px; border:1px solid var(--line); border-radius:6px; background:white; color:var(--ink); font-size:24px; cursor:pointer; box-shadow:0 2px 8px rgba(9,37,75,.1); }
    .detail h2 { margin:0 38px 5px 0; font-size:20px; line-height:1.25; }
    .detail-logo { width:120px; height:56px; object-fit:contain; object-position:left center; margin:2px 0 8px; }
    .status { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:4px 8px; font-size:12px; font-weight:750; margin:7px 0 14px; }
    .detail dl { margin:0; }
    .detail dt { color:var(--muted); font-size:12px; font-weight:700; margin-top:12px; }
    .detail dd { margin:3px 0 0; overflow-wrap:anywhere; }
    .detail a { color:var(--blue); text-decoration-thickness:1px; text-underline-offset:2px; }
    .source-note { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .leaflet-popup-content { margin:12px 14px; }
    .popup-name { font-weight:800; margin-bottom:4px; }
    .marker-chip { width:30px!important; height:30px!important; margin:-15px 0 0 -15px!important; border-radius:50%; display:grid!important; place-items:center; color:#fff; background:var(--green); border:2px solid white; box-shadow:0 2px 6px rgba(0,0,0,.35); font-size:9px; font-weight:900; overflow:hidden; }
    .marker-chip img { width:100%; height:100%; object-fit:contain; background:white; padding:2px; }
    .marker-chip.review { background:var(--green); }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background:rgba(19,72,71,.24); }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background:var(--green); color:#fff; }
    .empty { padding:30px 16px; color:var(--muted); text-align:center; }
    @media (max-width:760px) {
      body { overflow:auto; }
      .app { height:100dvh; grid-template-columns:1fr; grid-template-rows:64px minmax(340px, 56vh) 1fr; }
      header { height:64px; padding:0 12px; }
      .brand { min-width:0; }
      h1 { font-size:16px; }
      .subtitle { display:none; }
      .summary .metric { display:none; }
      .summary .metric:first-child { display:block; min-width:auto; padding:6px 0 6px 10px; }
      .sidebar { grid-row:3; border-right:0; border-top:1px solid var(--line); }
      .map-wrap { grid-row:2; }
      .company-list { max-height:none; }
      .legend { bottom:10px; left:10px; }
      .detail { position:fixed; left:8px; right:8px; top:auto; bottom:8px; width:auto; max-height:68dvh; }
    }
  </style>
</head>

  <script>
    const data = window.SUPPLIER_DATA;
    const companies = data.companies;
    const map = L.map('map', {zoomControl:true, minZoom:2}).setView([56.4, -98.5], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    const clusters = L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:42, spiderfyOnMaxZoom:true});
    const markerByName = new Map();
    const list = document.getElementById('companyList');
    const search = document.getElementById('search');
    const province = document.getElementById('province');
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const resultCount = document.getElementById('resultCount');
    const initials = name => name.replace(/\([^)]*\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    const provinceCode = c => {
      const text = `${c.geocodeLabel} ${c.address}`;
      const codes = ['AB','BC','MB','NB','NL','NS','NT','NU','ON','PE','QC','SK','YT'];
      const full = {Alberta:'AB','British Columbia':'BC',Manitoba:'MB','New Brunswick':'NB','Newfoundland and Labrador':'NL','Nova Scotia':'NS','Northwest Territories':'NT',Nunavut:'NU',Ontario:'ON','Prince Edward Island':'PE',Quebec:'QC',Québec:'QC',Saskatchewan:'SK',Yukon:'YT'};
      for (const [name,code] of Object.entries(full)) if (text.includes(name)) return code;
      for (const code of codes) if (new RegExp(`(^|[,;\\s])${code}([,;\\s]|$)`, 'i').test(text)) return code;
      return c.geocodeLabel.includes('United States') ? 'US' : '';
    };
    companies.forEach(c => c.province = provinceCode(c));
    [...new Set(companies.map(c=>c.province).filter(Boolean))].sort().forEach(code => { const o=document.createElement('option'); o.value=code; o.textContent=code==='US'?'United States':code; province.appendChild(o); });
    const isMapped = c => Number.isFinite(c.latitude) && Number.isFinite(c.longitude);
    const statusLabel = c => isMapped(c) ? 'Verified location' : 'Not mapped';
    const safeUrl = value => /^https?:\/\//i.test(value||'') ? value : '';
    function showDetail(c) {
      document.querySelectorAll('.company-item').forEach(el=>el.classList.toggle('active', el.dataset.name===c.name));
      detail.innerHTML = `<button class="detail-close" type="button" aria-label="Close details">×</button>${c.logoPath?`<img class="detail-logo" src="${c.logoPath}" alt="${c.name} logo">`:''}<h2>${c.name}</h2><div class="status"><span class="dot ${isMapped(c)?'verified-address':'unmapped-review'}"></span>${statusLabel(c)}</div><dl><dt>Business address</dt><dd>${c.address || 'No reliable public business location found'}</dd><dt>Map match</dt><dd>${c.geocodeLabel || 'No coordinates assigned'}</dd><dt>Website</dt><dd>${safeUrl(c.website)?`<a href="${c.website}" target="_blank" rel="noopener">${c.website}</a>`:'Not confirmed'}</dd><dt>Public phone</dt><dd>${c.phone?`<a href="tel:${c.phone.replace(/\s/g,'')}">${c.phone}</a>`:'Not published on the official website'}</dd><dt>Directory source</dt><dd><a href="${c.sourceUrl}" target="_blank" rel="noopener">Seeds Canada supplier directory</a></dd>${safeUrl(c.referenceSource)?`<dt>Address source</dt><dd><a href="${c.referenceSource}" target="_blank" rel="noopener">Open source</a></dd>`:''}${safeUrl(c.phoneSource)?`<dt>Phone source</dt><dd><a href="${c.phoneSource}" target="_blank" rel="noopener">Official website</a></dd>`:''}${safeUrl(c.logoSource)?`<dt>Logo source</dt><dd><a href="${c.logoSource}" target="_blank" rel="noopener">Official website asset</a></dd>`:''}<dt>Checked</dt><dd>${c.checkedDate || 'September 28, 2026'}</dd></dl><div class="source-note">Locations and phone numbers come from public sources and are provided for supplier research.</div>`;
      detail.classList.add('open');
      detail.querySelector('.detail-close').addEventListener('click',()=>detail.classList.remove('open'));
      const marker = markerByName.get(c.name);
      if (marker) { clusters.zoomToShowLayer(marker,()=>{ marker.openPopup(); map.panTo(marker.getLatLng()); }); }
    }
    function render() {
      const q = search.value.trim().toLowerCase();
      const filtered = companies.filter(c => (!q || `${c.name} ${c.address} ${c.geocodeLabel} ${c.phone||''}`.toLowerCase().includes(q)) && (!province.value || c.province===province.value) && (!status.value || (status.value==='mapped' ? isMapped(c) : !isMapped(c))));
      list.innerHTML = '';
      clusters.clearLayers(); markerByName.clear();
      filtered.forEach(c => {
        const brand = c.logoPath ? `<img src="${c.logoPath}" alt="">` : initials(c.name);
        const li=document.createElement('li'); const btn=document.createElement('button'); btn.type='button'; btn.className='company-item'; btn.dataset.name=c.name; btn.innerHTML=`<span class="monogram">${brand}</span><span><span class="company-name">${c.name}</span><span class="company-meta"><span class="dot ${isMapped(c)?'verified-address':'unmapped-review'}"></span>${c.province || 'Location pending'} · ${statusLabel(c)}</span></span>`; btn.addEventListener('click',()=>showDetail(c)); li.appendChild(btn); list.appendChild(li);
        if (isMapped(c)) { const icon=L.divIcon({className:'marker-chip',html:brand}); const marker=L.marker([c.latitude,c.longitude],{icon,title:c.name}).bindPopup(`<div class="popup-name">${c.name}</div><div>${c.address || statusLabel(c)}</div>`); marker.on('click',()=>showDetail(c)); clusters.addLayer(marker); markerByName.set(c.name,marker); }
      });
      resultCount.textContent = `Showing ${filtered.length} of ${companies.length}`;
      if (!filtered.length) list.innerHTML='<li class="empty">No companies match these filters</li>';
      map.addLayer(clusters);
    }
    [search,province,status].forEach(el=>el.addEventListener(el===search?'input':'change',render));
    document.getElementById('reset').addEventListener('click',()=>{search.value='';province.value='';status.value='';render();});
    document.getElementById('officialCount').textContent=data.officialCount;
    document.getElementById('mappedCount').textContent=companies.filter(c=>Number.isFinite(c.latitude)).length;
    document.getElementById('notMappedCount').textContent=companies.filter(c=>!isMapped(c)).length;
    render();
  </script>
